[project]
# The import package and the command are both `kairo`; "kairo" itself is
# taken on PyPI by an unrelated project.
name = "kairo-eda"
version = "0.1.0"
description = "MCP server that turns design intent into verified KiCad schematics, with every voltage and current checked by sourced formulas and by SPICE."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Josh" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Kairo is not published to PyPI yet. This classifier stops PyPI from
# accepting an upload by mistake; remove it when publishing is decided.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.13",
]

[project.optional-dependencies]
# Reading the tables of a datasheet PDF (kairo.parts.datasheet). Left out
# of the core so a plain install stays small.
datasheets = ["pdfplumber>=0.11"]

[project.scripts]
kairo = "kairo.cli:main"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# One package: the Python under src/ and the router's and drawing's inner
# loops (rust/kairo_fast) compiled into it as kairo._fast. A wheel is built
# for each platform; Kairo runs the Python versions of the loops where the
# module is not built.
[tool.maturin]
python-source = "src"
module-name = "kairo._fast"
manifest-path = "rust/kairo_fast/Cargo.toml"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE", format = "sdist" }, { path = "NOTICE", format = "sdist" }]

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names say what they check; a docstring on each would repeat the name.
"tests/**" = ["D"]
"docs/conf.py" = ["D100"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "kicad: needs kicad-cli installed; skipped when it is absent",
    "spice: needs a SPICE simulator installed; skipped when it is absent",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "pdfplumber>=0.11",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
]

[tool.uv]
# Docs tools are installed by default so `uv run sphinx-build` just works.
default-groups = ["dev", "docs"]
# Rebuild the compiled loops whenever their Rust changes, not only the version.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/kairo_fast/Cargo.toml" },
    { file = "rust/kairo_fast/src/**/*.rs" },
]
